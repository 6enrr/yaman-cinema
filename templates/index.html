<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>يمان سينما | Yaman Cinema</title>
    <style>
        body { background-color: #0d1117; color: #ffffff; font-family: Tahoma, sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #30363d; padding-bottom: 15px; flex-wrap: wrap; gap: 15px; }
        .logo { font-size: 24px; font-weight: bold; color: #58a6ff; text-decoration: none; }
        input[type="text"] { padding: 10px; width: 300px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: white; }
        button { padding: 10px 20px; border-radius: 6px; border: none; background: #238636; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        
        .player-box { 
            width: 100%; 
            max-width: 950px; 
            margin: 0 auto 15px auto; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.3); 
            border: 1px solid #30363d; 
            aspect-ratio: 16 / 9; 
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* أزرار تبديل السيرفرات لتجاوز الشاشة السوداء فوراً */
        .servers-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        .server-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .server-btn.active, .server-btn:hover {
            background: #1f6feb;
            color: white;
            border-color: #388bfd;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: #161b22; border-radius: 10px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; border: 1px solid #30363d; }
        .card:hover { transform: scale(1.03); border-color: #58a6ff; }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-body { padding: 15px; text-align: center; }
        .card-title { font-size: 16px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .watch-btn { display: inline-block; padding: 8px 15px; background: #1f6feb; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold; }
        .watch-btn:hover { background: #388bfd; }
    </style>
</head>
<body>

    <div class="header">
        <a href="/" class="logo">🎬 يمان سينما (Yaman Cinema)</a>
        <form method="GET" action="/">
            <input type="text" name="q" placeholder="ابحث في آلاف الأفلام..." required>
            <button type="submit">بحث</button>
        </form>
    </div>

    {% if watch_id %}
    <div class="player-box">
        <iframe id="movie-player" src="https://vidsrc.pro/embed/movie/{{ watch_id }}" allowfullscreen></iframe>
    </div>
    
    <!-- قائمة أزرار تبديل السيرفرات -->
    <div class="servers-bar">
        <button class="server-btn active" onclick="switchServer('https://vidsrc.pro/embed/movie/{{ watch_id }}', this)">سيرفر 1 (Pro)</button>
        <button class="server-btn" onclick="switchServer('https://vidsrc.xyz/embed/movie/{{ watch_id }}', this)">سيرفر 2 (XYZ)</button>
        <button class="server-btn" onclick="switchServer('https://vidsrc.me/embed/movie?tmdb={{ watch_id }}', this)">سيرفر 3 (Me)</button>
        <button class="server-btn" onclick="switchServer('https://embed.su/embed/movie/{{ watch_id }}', this)">سيرفر 4 (EmbedSu)</button>
    </div>

    <script>
        function switchServer(url, btn) {
            document.getElementById('movie-player').src = url;
            document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
    {% endif %}

    <h2 style="border-right: 4px solid #58a6ff; padding-right: 10px;">{{ title_header }}</h2>
    
    <div class="grid">
        {% for movie in movies %}
        <div class="card">
            {% if movie.poster_path %}
                <img src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}" alt="{{ movie.title }}">
            {% else %}
                <img src="https://via.placeholder.com/500x750?text=No+Poster" alt="No Image">
            {% endif %}
            <div class="card-body">
                <div class="card-title" title="{{ movie.title }}">{{ movie.title }}</div>
                <p style="color: #8b949e; font-size: 13px;">⭐ {{ movie.vote_average }}</p>
                <a href="/?watch={{ movie.id }}" class="watch-btn">▶ مشاهدة الفيلم</a>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
